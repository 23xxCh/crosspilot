name: Live API Canary

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'

concurrency:
  group: live-api-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check canary credentials
        id: credentials
        env:
          CROSSPILOT_DEEPSEEK_KEY: ${{ secrets.CROSSPILOT_DEEPSEEK_KEY }}
          CROSSPILOT_AGNES_KEY: ${{ secrets.CROSSPILOT_AGNES_KEY }}
        shell: bash
        run: |
          if [[ -n "$CROSSPILOT_DEEPSEEK_KEY" && -n "$CROSSPILOT_AGNES_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Live canary skipped: configure CROSSPILOT_DEEPSEEK_KEY and CROSSPILOT_AGNES_KEY." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run live end-to-end canary
        if: steps.credentials.outputs.enabled == 'true'
        env:
          CROSSPILOT_DEEPSEEK_KEY: ${{ secrets.CROSSPILOT_DEEPSEEK_KEY }}
          CROSSPILOT_AGNES_KEY: ${{ secrets.CROSSPILOT_AGNES_KEY }}
        run: uv run pytest tests/test_pipeline.py -m network -k test_pipeline_with_sample -q --tb=short
