name: Amazon Core Offline Tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e . pytest pytest-cov pyright ruff
      - name: Lint runtime errors and bug patterns
        run: python -m ruff check amazon_processor tests
      - name: Type-check hardened service modules
        run: python -m pyright
      - name: Run offline tests with coverage gate
        run: python -m pytest --cov=amazon_processor --cov-report=term --cov-fail-under=75 -q
      - name: Parse Windows unattended scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content './90_系统工具/服务器后台/安装后台服务.ps1' -Raw))
          [void][scriptblock]::Create((Get-Content './90_系统工具/服务器后台/后台服务看门狗.ps1' -Raw))
          [void][scriptblock]::Create((Get-Content './90_系统工具/服务器后台/更新系统.ps1' -Raw))
