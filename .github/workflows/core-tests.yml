name: Amazon Core Offline Tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e . pytest
      - name: Run offline contract and regression tests
        run: python -m pytest -q
