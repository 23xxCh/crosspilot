name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: uv run pyinstaller --onefile --name CrossPilot --add-data "web/static:web/static" --add-data "web/runner.py:web" --add-data "scripts:scripts" --add-data "keys.example.json:." main_cli.py

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/CrossPilot.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}