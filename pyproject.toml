[project]
name = "amazon-json-processor"
version = "1.0.0"
description = "Amazon JSON 采集表核心处理器"
requires-python = ">=3.11"
dependencies = [
    "langdetect>=1.0.9",
    "pillow>=10.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_processor"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".runtime", "02_处理结果"]
markers = [
    "network: tests that need API keys and internet access",
    "slow: tests that take more than 10 seconds",
]
addopts = "-m 'not network'"
