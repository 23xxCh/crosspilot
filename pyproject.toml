[project]
name = "crosspilot"
dynamic = ["version"]
description = "跨境电商 Listing 全自动清洗平台"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "crosspilot/version.py"

[tool.hatch.build.targets.wheel]
packages = ["crosspilot", "scripts", "web"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "build", "data", "dist"]
markers = [
    "network: tests that need API keys and internet access",
    "slow: tests that take > 10 seconds",
]
addopts = "-m 'not network'"
