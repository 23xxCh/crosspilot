[project]
name = "crosspilot"
version = "1.0"
description = "跨境电商 Listing 全自动清洗平台"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that need API keys and internet access",
    "slow: tests that take > 10 seconds",
]
addopts = "-m 'not network'"
