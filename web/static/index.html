<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossPilot — 跨境电商 Listing 清洗平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-layout">
  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">CP</div>
      <div>
        <div class="sidebar-title">CrossPilot</div>
        <div class="sidebar-sub">跨境 Listing 清洗引擎</div>
      </div>
    </div>

    <!-- Platform filter -->
    <div class="sidebar-platforms">
      <div class="platform-label">目标平台</div>
      <span class="platform-tag active">TikTok Shop</span>
      <span class="platform-tag soon">Shopee</span>
      <span class="platform-tag soon">Lazada</span>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">主导航</div>
      <a class="sidebar-item active" data-route="/" href="#/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>仪表盘</span>
      </a>
      <a class="sidebar-item" data-route="/tasks" href="#/tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>任务</span>
      </a>
      <a class="sidebar-item" data-route="/templates" href="#/templates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <span>模板</span>
      </a>

      <div class="sidebar-section" style="margin-top:8px">系统</div>
      <a class="sidebar-item" data-route="/settings" href="#/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-status">
        <div class="sidebar-status-dot" id="conn-dot"></div>
        <span id="conn-label">已连接</span>
      </div>
      <div class="sidebar-version">v0.2</div>
    </div>
  </aside>

  <!-- ====== MAIN ====== -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left" id="breadcrumb">
        <span style="color:var(--text-muted)">CrossPilot</span>
        <span class="sep">/</span>
        <span class="current">仪表盘</span>
      </div>
      <div class="topbar-right">
        <span class="tb-badge" id="running-badge" hidden>0 运行中</span>
        <span class="tb-clock" id="clock"></span>
      </div>
    </div>

    <div class="content" id="view">
      <!-- Rendered by SPA router -->
    </div>
  </main>
</div>

<div id="toast-container"></div>
<input type="file" id="filepick" accept=".xlsx" multiple hidden>

<script src="app.js?v=5"></script>
</body>
</html>
